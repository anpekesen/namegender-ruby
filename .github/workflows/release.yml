# RubyGems yayını.
name: release

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    # gem push kimlik bilgisi bulamazsa etkileşimli olarak sorar ve CI'da
    # altı saatlik iş zaman aşımına kadar bekler. Yayın birkaç dakika sürer.
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.3'

      - run: ruby -Ilib -e 'require "namegender"'

      - name: Sürüm etiketle eşleşiyor mu
        run: |
          ver=$(ruby -e 'puts Gem::Specification.load("namegender.gemspec").version')
          tag="${GITHUB_REF_NAME#v}"
          if [ "$ver" != "$tag" ]; then
            echo "gemspec ($ver) ile etiket ($tag) uyuşmuyor" >&2
            exit 1
          fi

      - name: Yayınla
        run: |
          if [ -z "$RUBYGEMS_API_KEY" ]; then
            echo "RUBYGEMS_API_KEY secret'ı tanımlı değil; yayın yapılmadı." >&2
            exit 1
          fi
          mkdir -p ~/.gem
          printf -- "---\n:rubygems_api_key: %s\n" "$RUBYGEMS_API_KEY" > ~/.gem/credentials
          chmod 600 ~/.gem/credentials
          gem build namegender.gemspec
          # stdin kapalı: MFA "UI and API" seviyesindeyse gem push tek kullanımlık
          # kod sorar. CI'da kodu girecek kimse yok; beklemek yerine hemen düşsün.
          gem push namegender-*.gem < /dev/null
        env:
          RUBYGEMS_API_KEY: ${{ secrets.RUBYGEMS_API_KEY }}
